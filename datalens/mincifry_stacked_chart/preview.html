<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Предпросмотр чарта — стиль Минцифры</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
    body {
        margin: 0;
        padding: 24px;
        background: #F5F7FA;
        font-family: 'Ubuntu', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        color: #0B1F33;
    }
    .card {
        max-width: 1040px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #E4E8EE;
        border-radius: 12px;
        padding: 8px;
        box-shadow: 0 2px 8px rgba(11, 31, 51, .06);
    }
    #chart { height: 560px; }
    p.note { max-width: 1040px; margin: 16px auto 0; color: #5A7196; font-size: 13px; }
</style>
</head>
<body>
<div class="card"><div id="chart"></div></div>
<p class="note">
    Локальный предпросмотр оформления. Данные и настройки повторяют вкладки
    <code>03_prepare.js</code> и <code>05_highcharts.js</code>.
</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.8/highcharts.js"></script>
<script>
const BRAND = {
    blue: '#0D4CD3', red: '#EE3F58', green: '#0FA958',
    ink: '#0B1F33', muted: '#5A7196', grid: '#E4E8EE', axis: '#C9D2DE', bg: '#FFFFFF'
};
const FONT = "'Ubuntu', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
const MIN_LABEL_SHARE = 0.06;

function fmtNumber(value) {
    if (value === null || value === undefined || isNaN(value)) return '—';
    const rounded = Math.round(Number(value) * 100) / 100;
    const parts = String(rounded).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return parts.join(',');
}

Highcharts.chart('chart', {
    chart: {type: 'column', backgroundColor: BRAND.bg, spacing: [28, 24, 16, 16],
        style: {fontFamily: FONT, color: BRAND.ink}},
    title: {text: 'Услуги по годам', align: 'left', margin: 24,
        style: {color: BRAND.ink, fontSize: '20px', fontWeight: '700', fontFamily: FONT}},
    subtitle: {text: 'Онлайн · Проактив · Рефакторинг, ед.', align: 'left',
        style: {color: BRAND.muted, fontSize: '13px', fontFamily: FONT}},
    xAxis: {
        categories: ['2025', '2026', '2027'],
        lineColor: BRAND.axis, lineWidth: 1, tickColor: BRAND.axis, tickLength: 6, gridLineWidth: 0,
        labels: {style: {color: BRAND.muted, fontSize: '13px', fontFamily: FONT}},
        crosshair: {color: 'rgba(13, 76, 211, 0.06)', width: 48, zIndex: 0}
    },
    yAxis: {
        title: {text: null}, gridLineColor: BRAND.grid, gridLineDashStyle: 'Dash', lineWidth: 0,
        labels: {style: {color: BRAND.muted, fontSize: '12px', fontFamily: FONT},
            formatter: function () { return fmtNumber(this.value); }},
        stackLabels: {
            enabled: true, crop: false, overflow: 'allow', allowOverlap: false, y: -6,
            style: {color: BRAND.ink, fontSize: '13px', fontWeight: '700', fontFamily: FONT,
                textOutline: '2px #FFFFFF'},
            formatter: function () { return fmtNumber(this.total); }
        }
    },
    plotOptions: {
        column: {
            stacking: 'normal', borderWidth: 0, borderRadius: 2,
            groupPadding: 0.28, pointPadding: 0.02, maxPointWidth: 56,
            states: {hover: {brightness: 0.06}, inactive: {opacity: 0.35}},
            dataLabels: {
                enabled: true, inside: true, crop: true, allowOverlap: false,
                style: {color: '#FFFFFF', fontSize: '12px', fontWeight: '600',
                    fontFamily: FONT, textOutline: 'none'},
                formatter: function () {
                    const total = this.point.stackTotal;
                    if (!this.y) return null;
                    if (total && Math.abs(this.y) / total < MIN_LABEL_SHARE) return null;
                    return fmtNumber(this.y);
                }
            }
        }
    },
    legend: {
        align: 'center', verticalAlign: 'bottom', symbolRadius: 6,
        symbolHeight: 10, symbolWidth: 10, itemDistance: 24, itemMarginTop: 8,
        itemStyle: {color: BRAND.ink, fontSize: '13px', fontFamily: FONT},
        itemHoverStyle: {color: BRAND.blue}, itemHiddenStyle: {color: '#A8B4C4'}
    },
    tooltip: {
        shared: true, useHTML: true, backgroundColor: '#FFFFFF', borderColor: BRAND.grid,
        borderRadius: 8, borderWidth: 1,
        style: {color: BRAND.ink, fontSize: '13px', fontFamily: FONT},
        formatter: function () {
            const head = '<div style="font-weight:700;margin-bottom:6px">' + this.x + '</div>';
            let total = 0;
            const body = this.points.map(function (p) {
                if (p.series.type !== 'line') total += p.y;
                return '<div style="display:flex;gap:8px;align-items:center;line-height:20px">' +
                    '<span style="width:8px;height:8px;border-radius:2px;background:' + p.color + '"></span>' +
                    '<span style="flex:1">' + p.series.name + '</span><b>' + fmtNumber(p.y) + '</b></div>';
            }).join('');
            const foot = '<div style="margin-top:6px;padding-top:6px;border-top:1px solid ' + BRAND.grid +
                ';display:flex;gap:8px"><span style="flex:1">Всего услуг</span><b>' +
                fmtNumber(total) + '</b></div>';
            return head + body + foot;
        }
    },
    credits: {enabled: false},
    series: [
        {name: 'Рефакторинг', color: BRAND.green, data: [82, 159, 74], stack: 'services'},
        {name: 'Проактив',    color: BRAND.red,   data: [40, 45, 5],   stack: 'services'},
        {name: 'Онлайн',      color: BRAND.blue,  data: [9, 31, 19],   stack: 'services'}
    ]
});
</script>
</body>
</html>
